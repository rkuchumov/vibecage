[firewall]
name = 'vc-workdir-main'
image = 'vc-workdir-main'

enable = true

kill_on_breach = false

whitelist = [
	"github.com",
	"*.github.com",
	"githubusercontent.com",
	"*.githubusercontent.com",
	"opencode.ai",
	"*.opencode.ai",
	"pypi.org",
	"*.pypi.org",
	"pythonhosted.org",
	"*.pythonhosted.org",
	"npmjs.org",
	"*.npmjs.org",
]

[jail]
image = 'vc-workdir-main'
name = 'vc-workdir-main'

ports = ["4096:4096"]

envs = [
	'HOME'
]

mounts = [
	"src",
	"pyproject.toml",
	"$workdir/.cage/mount/.local/:/home/$user/.local/:Z",
	"$workdir/.cage/mount/.config/:/home/$user/.config/:Z",
	"$workdir/.cage/mount/.pi/:/home/$user/.pi/:Z",
]

allow_gpu = true


